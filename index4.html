<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Website - Fully Responsive</title>
    <style>
        /*
        ========================================
        1. Base Styles 
        ========================================
        */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            perspective: none;
        }

        /* The Logo Container (Parent) */
        #agency-element {
            width: 80px;
            height: 80px;
            border-radius: 50%;

            position: fixed;
            /* This transition is necessary to make the sudden 180-degree flip visible */
            transition: transform 0.3s ease-out;
            /* FIX: Set a higher z-index to ensure it sits on top of the header */
            z-index: 10000;

            /* 3D properties now live here */
            transform-style: preserve-3d;
            perspective: 1000px;
            background-color: transparent;
        }

        /* Styles for both Front and Back faces */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;

            backface-visibility: hidden;
        }

        /* Front Face: The "AD" Logo */
        .face-front {
            background-color: #4CAF50;
            /* Green */
            transform: rotateY(0deg);
        }

        /* Back Face: The Web Dev Icon */
        .face-back {
            background-color: #007bff;
            /* Blue for the other side */
            transform: rotateY(180deg);
        }

        /* The standard header bar container */
        #main-header {
            width: 100%;
            height: 80px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            transition: none;
            /* Header z-index remains high, but now logo is higher */
            z-index: 9999;
            transform: none;
        }

        /* Content to ensure scrolling is possible */
        #page-content {
            min-height: 200vh;
            padding-top: 100vh;
            text-align: center;
            padding-bottom: 50px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
        }

        .face img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #007bff;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <header id="main-header"></header>

    <div id="agency-element">
        <div class="face face-front">
            <img src="portfolio.png" alt="AD Logo" class="face-image">
        </div>
        <div class="face face-back">
            <img src="./logo.png" alt="Web Dev Icon" class="face-image">
        </div>
    </div>

    <section id="page-content">
        <h1>Dynamic Web Presence (Responsive)</h1>
        <p>The logo now flies over the fixed header.</p>
        <div style="margin-top: 50vh;">
            <h2>Modern Design Principles</h2>
            <p>Clean | Intuitive | Accessible</p>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const element = document.getElementById('agency-element');
            const header = document.getElementById('main-header');

            // --- 1. CONFIGURATION ---
            const SCROLL_RANGE = 300;
            const BASE_ELEM_SIZE = 80;
            const DESIRED_FINAL_SIZE = 50;

            // START Values (ScrollY = 0)
            const SCALE_START = 2.5;
            const START_TOP = window.innerHeight / 2;
            const START_LEFT_VW = 50;
            const START_SHADOW = '0 10px 30px rgba(76, 175, 80, 0.4)';

            // END Values (ScrollY = SCROLL_RANGE)
            const SCALE_END = DESIRED_FINAL_SIZE / BASE_ELEM_SIZE;
            const END_TOP = 40;
            const END_LEFT_PX = 50;

            // SUDDEN ROTATION THRESHOLD is very low (0.01) to trigger immediately on scroll start.
            const ROTATION_THRESHOLD = 0.01;
            const ROTATE_FINAL = 180;

            /**
             * Linear Interpolation (Lerp) function.
             */
            const lerp = (a, b, t) => a + (b - a) * t;

            /**
             * The main function that drives the animation based on scroll.
             */
            function handleScroll() {
                const scrollY = window.scrollY;

                // Clamp the scroll fraction t between 0.0 and 1.0
                const t = Math.min(1, Math.max(0, scrollY / SCROLL_RANGE));

                // --- 2. CALCULATE CURRENT VALUES ---

                // Position and Scale are interpolated smoothly
                const currentScale = lerp(SCALE_START, SCALE_END, t);
                const currentTop = lerp(START_TOP, END_TOP, t);
                const startLeftInPx = (START_LEFT_VW / 100) * window.innerWidth;
                const currentLeft = lerp(startLeftInPx, END_LEFT_PX, t);

                // SUDDEN ROTATION LOGIC: 0 degrees until a tiny scroll movement, then 180 degrees instantly.
                const currentRotation = (t >= ROTATION_THRESHOLD) ? ROTATE_FINAL : 0;

                const headerOpacity = t;

                // --- 3. APPLY STYLES ---

                // The transform now rotates the *container*, flipping the faces.
                element.style.transform = `
                    translate(-50%, -50%) 
                    scale(${currentScale})
                    rotateY(${currentRotation}deg)
                `;

                // Update fixed position using calculated pixel values
                element.style.top = `${currentTop}px`;
                element.style.left = `${currentLeft}px`;

                // Header opacity and shadow
                header.style.opacity = headerOpacity;
                header.style.boxShadow = `0 4px 12px rgba(0, 0, 0, ${t * 0.15})`;

                // Apply/Remove element shadow via JS (since the container is now transparent)
                element.style.boxShadow = (t === 1) ? 'none' : START_SHADOW;
            }

            // To ensure responsiveness on resize, we re-run the calculation function.
            window.addEventListener('resize', handleScroll);
            // Attach the function to the window's scroll event
            window.addEventListener('scroll', handleScroll, { passive: true });

            // Run once on load to set the initial position
            handleScroll();
        });
    </script>
</body>

</html>
